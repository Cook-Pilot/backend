# VPS 배포용. 소스를 빌드하지 않고 GHCR 이미지를 pull 한다.
# (로컬 개발은 docker-compose.yml 을 쓴다 — 그쪽은 build: . 로 소스에서 빌드)
#
# 최초 기동:
#   cp .env.example .env && vi .env      # 비밀번호 반드시 교체
#   docker compose -f docker-compose.prod.yml up -d
#
# 이후 배포:
#   main 푸시 -> CI가 ghcr.io/cook-pilot/backend:latest 갱신
#            -> watchtower가 폴링으로 감지, app 컨테이너만 자동 교체
#   (수동 개입 불필요. 기존 env/볼륨/포트 설정은 그대로 유지된다.)

services:
  app:
    image: ghcr.io/cook-pilot/backend:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 소셜 로그인. JWT_SECRET 이 바뀌면 발급된 토큰이 전부 무효가 된다.
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      DEV_LOGIN_SECRET: ${DEV_LOGIN_SECRET:-}
      # 리뷰 사진 버킷. 비우면 업로드 없이 목 URL 을 돌려준다.
      # 자격증명은 넣지 않는다 — EC2 인스턴스 역할을 SDK 가 자동으로 집는다.
      PHOTOS_BUCKET: ${PHOTOS_BUCKET:-}
      PHOTOS_REGION: ${PHOTOS_REGION:-ap-northeast-2}
      # 조리 중 AI 피드백(Spring AI). AI_CHAT_PROVIDER 가 none 이면 LLM 을 호출하지 않고
      # 목 응답만 나간다(기본값). 키는 F-11 추천 설명과 같은 Google AI Studio 키를 공유한다.
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-3.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # 새 이미지가 부팅에 실패해도 restart 정책 때문에 컨테이너는 계속 살아있는 척한다.
    # (예: 운영 데이터에서만 깨지는 Flyway 마이그레이션 → 기동 실패 → 무한 재시작)
    # 헬스체크를 붙여야 `docker compose ps` 와 CI 스모크가 그 상태를 unhealthy 로 본다.
    # start_period 동안의 실패는 재시작으로 세지 않는다 — Spring 기동에 수십 초가 걸린다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      # watchtower가 --label-enable 로 이 컨테이너만 감시한다.
      com.centurylinklabs.watchtower.enable: "true"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      # 서버 호스트의 루프백에만 바인딩한다. 인터넷에는 노출되지 않고,
      # SSH 터널(ssh -L 5432:localhost:5432)로만 IDE에서 접근한다.
      - "127.0.0.1:5432:5432"
    # watchtower 라벨은 붙이지 않는다 — DB가 멋대로 메이저 업그레이드되면 안 된다.

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR 패키지가 private 이면 아래 주석을 풀고, VPS에서 먼저:
      #   echo <PAT> | docker login ghcr.io -u <github-id> --password-stdin
      # (PAT 스코프: read:packages)
      # - ~/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}

volumes:
  pgdata:
