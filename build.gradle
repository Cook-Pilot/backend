plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cookpilot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	// F-08은 SDK 내부 transport의 연결 재시도와 redirect도 명시적으로 끈다.
	implementation 'com.squareup.okhttp3:okhttp'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 영속 계층(그룹 A). 스키마 정본은 Flyway, JPA는 validate 로 검증만 한다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 엔티티 제약(@Min/@Max 등)을 flush 전에 검증 — DB CHECK 위반을 앞단에서 명확한 예외로 잡는다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Boot 4 는 자동설정이 모듈별로 쪼개져 있다. 이 모듈이 없으면 flyway-core 가 있어도
	// FlywayAutoConfiguration 이 없어 마이그레이션이 아예 실행되지 않는다(= validate 실패).
	implementation 'org.springframework.boot:spring-boot-flyway'
	// OpenAPI 스펙 자동 생성 + Swagger UI(/swagger-ui.html). 3.x 라인이 Boot 4/Framework 7 호환
	// (2.x 는 Boot 3 전용이라 올리면 기동 실패). Boot BOM 이 버전을 관리하지 않아 명시 고정한다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	runtimeOnly 'org.postgresql:postgresql'
	// 엔티티 getter/setter 보일러플레이트 제거. 컴파일 타임 전용(런타임 의존성 아님).
	// 엔티티에는 @Getter/@Setter 만 쓴다 — @Data/@EqualsAndHashCode/@ToString 은
	// 지연로딩 프록시를 건드리고 식별자 규약을 깨서 JPA 에서 쓰지 않는다.
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 실제 postgres 컨테이너로 리포지토리를 검증한다(운영과 동일 DB).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Testcontainers 2.0 에서 모듈 좌표가 testcontainers-* 로 개명됨. Boot 4 는 코어(2.0.5)만
	// 관리하고 개별 모듈 버전은 관리하지 않아 명시 고정한다.
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
	// 기본(무프로파일) 컨텍스트가 DB 없이 뜨도록 임베디드 DB만 제공한다(목 웹 테스트용).
	// 실제 스키마 검증은 db 프로파일 + Testcontainers postgres 로 한다.
	testRuntimeOnly 'com.h2database:h2'
	// MainApplicationTests 를 전체 테스트 실행용 @Suite 로 쓰기 위한 의존성.
	testImplementation 'org.junit.platform:junit-platform-suite'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// MainApplicationTests 는 전체 테스트를 묶는 @Suite 다. Gradle 은 이미 개별 테스트를 모두
	// 실행하므로, 스위트까지 돌리면 중복 실행된다. Gradle 실행에서는 스위트를 빼고(개별 1회),
	// 스위트는 IDE 원클릭 전체 실행용으로만 쓴다.
	exclude '**/MainApplicationTests.class'
	// 실패 시 예외 전체 메시지/원인 사슬을 콘솔에 찍는다. 기본 로깅은 예외 클래스+위치만 보여줘서
	// SchemaManagementException 의 실제 진단("어느 컬럼 타입이 어긋났는지")이 가려진다.
	testLogging {
		exceptionFormat = 'full'
		showCauses = true
		showStackTraces = true
		events 'failed'
	}
}

// Dockerfile이 고정된 경로를 COPY 한다. -plain.jar 와 함께 glob 되면 빌드가 깨진다.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
