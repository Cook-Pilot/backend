# @claude 멘션 응답. 이슈·PR 코멘트에서 @claude 를 부르면 이 워크플로가 실행한다 —
# GitHub 앱 설치만으로는 아무것도 돌지 않는다(앱은 인증용, 실행은 여기).
# 멘션 트리거는 기본 브랜치의 워크플로를 쓰므로 이 파일은 머지된 뒤부터 동작한다.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # 구독(OAuth) 인증. 조직/레포 시크릿 CLAUDE_CODE_OAUTH_TOKEN 이 있어야 돈다 —
          # `claude setup-token` 으로 발급(Pro/Max).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
