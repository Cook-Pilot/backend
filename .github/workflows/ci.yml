name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 마이그레이션 번호는 파일 이름이 아니라 착지 순서에 대한 약속이다. Flyway 는
  # outOfOrder=false(스프링 기본)라, 이미 적용된 것보다 낮은 번호가 뒤늦게 들어오면
  # 다음 기동이 validate 에서 죽는다. 이 레포는 main 푸시가 곧 배포라 그 사고는
  # 머지 직후 운영에서 터진다.
  #
  # 브랜치를 여러 개 띄워두면 각자 그때의 최신 번호를 집기 때문에 반드시 부딪힌다 —
  # 2026-08-18 에 세 브랜치가 동시에 V12 를 집었다. 사람 눈 대신 여기서 막는다.
  #
  # PR 에서는 base 브랜치와, main 푸시에서는 푸시 직전 커밋과 비교한다. 후자가 있는
  # 이유는 PR 검사가 낡을 수 있어서다 — 두 PR 이 각자 초록불을 받고 하나가 먼저
  # 머지·배포되면, 나머지는 낮은 번호인 채로 들어온다. 그 경우 배포 전에 잡는다.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base ref 와 비교해야 해서 얕은 클론으로는 부족하다

      - name: Check migration order
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 .github/scripts/check_migration_order.py "$BASE"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      # OpenApiDocsTest 가 build/openapi.json 을 떨군다(키 정렬·들여쓰기 정규화 = 바이트 안정).
      # 커밋된 정본과 어긋나면 스펙이 낡은 것이므로 실패시킨다 — 프론트 클라이언트 생성이
      # 이 파일을 소비하므로, 코드만 바뀌고 스펙이 안 따라오는 상태를 막는다.
      - name: Check OpenAPI spec is up to date
        run: |
          if ! diff -u docs/openapi.json build/openapi.json; then
            echo "::error::docs/openapi.json 이 코드와 다릅니다. 로컬에서 아래를 실행하고 커밋하세요:"
            echo "::error::./gradlew test --tests '*OpenApiDocsTest' && cp build/openapi.json docs/openapi.json"
            exit 1
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [test, migrations]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 런타임 스테이지를 amd64 러너에서 만들기 위한 에뮬레이션.
      # Gradle 빌드는 Dockerfile의 $BUILDPLATFORM 덕에 네이티브로 돌기 때문에,
      # 여기서 에뮬레이션되는 건 런타임 스테이지의 adduser 정도라 부담이 없다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR에서는 푸시 없이 빌드만 검증한다. main 푸시일 때만 GHCR에 올린다.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # multi-arch. 호스트가 pull 할 때 자기 아키텍처에 맞는 변형을 자동으로 고른다.
          # arm64 = 현재 VPS, amd64 = 향후 AWS(Graviton이 아닌 경우) 등. 이전 시 변경 불필요.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 이미지에 커밋을 박아 /actuator/info 로 드러낸다. smoke 잡이 이걸로
          # "구 컨테이너가 아직 답하는 중"과 "새 리비전이 떴다"를 구분한다.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이미지를 밀어넣었으니 서버에 반영한다. SSM 으로 명령만 보내므로 SSH 키를 CI 에 두지 않고
  # 22번 포트도 열지 않는다(인증은 OIDC 임시 자격증명). 서버는 레포를 pull 해서 compose 를
  # 최신으로 맞추므로, 이미지뿐 아니라 compose 변경도 함께 반영된다.
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      id-token: write   # OIDC 토큰 발급용. 이게 없으면 역할을 맡을 수 없다.
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # 파라미터를 파일로 넘긴다. 인라인 문자열로 넣으면 따옴표·줄바꿈이 깨져
          # 서버에 리터럴 "\n" 이 전달된다(첫 배포가 이걸로 실패했다).
          # 레포 갱신과 배포를 분리하는 이유는 infra/deploy.sh 주석 참고.
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "runuser -l ubuntu -c 'cd /home/ubuntu/backend && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
              "runuser -l ubuntu -c /home/ubuntu/backend/infra/deploy.sh"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)

          echo "SSM 명령 전송: $CMD_ID"

          # 완료까지 폴링. waiter 는 대기 한도가 짧아 이미지 pull 이 길어지면 먼저 끊긴다.
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- 서버 출력 ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 명령 실패 ($STATUS)"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            exit 1
          fi

  # 배포 명령이 성공해도 새 컨테이너가 정상 기동했는지는 별개다(예: 운영 데이터에서만 깨지는
  # 마이그레이션). 실물이 살아났는지까지 확인하고 워크플로를 닫는다.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'

    steps:
      # 배포 호스트 주소는 레포에 두지 않는다. 레포 변수(Settings > Variables)로 주입하고,
      # 없으면 실패가 아니라 경고 후 건너뛴다 — 포크·초기 세팅에서 CI 를 막지 않기 위해.
      - name: Verify deployed revision is live
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::DEPLOY_BASE_URL 변수가 없어 배포 스모크를 건너뜁니다. 레포 Settings > Secrets and variables > Actions > Variables 에 앱 베이스 URL(예: http://1.2.3.4:8080)을 등록하세요."
            exit 0
          fi

          BASE="${BASE_URL%/}"
          # Watchtower 폴링(기본 300초) + 이미지 pull + Spring 기동을 넉넉히 덮는다.
          DEADLINE=$(( $(date +%s) + 900 ))

          # jq 를 쓰지 않는다. ubuntu-latest 에는 있지만, 이 스크립트는 개발자가 자기 머신에서
          # 그대로 돌려볼 수 있어야 한다 — 배포 검증 스크립트가 검증 불가능하면 안 된다.
          # 응답 형태는 {"app":{"commit":"<sha>"}} 로 고정이라 grep 으로 충분하다.
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            COMMIT=$(curl -fsS --max-time 10 "$BASE/actuator/info" 2>/dev/null \
                     | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)

            if [ "$COMMIT" = "$EXPECTED_SHA" ]; then
              # 교체는 확인됐다. 이제 그 컨테이너가 정상인지 본다(DOWN 이면 curl -f 가 503 으로 실패).
              if curl -fsS --max-time 10 "$BASE/actuator/health" 2>/dev/null | grep -q '"status":"UP"'; then
                echo "배포 확인: $EXPECTED_SHA 리비전이 UP 입니다."
                exit 0
              fi
              echo "새 리비전은 떴지만 health 가 아직 UP 이 아닙니다. 재시도합니다."
            else
              echo "교체 대기 중 (현재 리비전: ${COMMIT:-응답없음})"
            fi
            sleep 15
          done

          echo "::error::15분 안에 $EXPECTED_SHA 리비전이 정상 기동하지 않았습니다. VPS 에서 확인하세요: docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs app"
          exit 1
