# 남용 방어. 익명 사용자 발급이 무인증이라, 발급을 무한 반복하면 업로드 인증도 사실상 우회된다.
# 두 엔드포인트만 조인다 — 조리 중 API 호출은 잦아서 전역 제한을 걸면 정상 사용자가 막힌다.
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=signup:10m rate=3r/m;

# 기본값 503(서버 문제)은 오해를 부른다. 429 = "너무 많이 보냈다"가 정확하다.
limit_req_status 429;
