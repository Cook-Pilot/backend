# 남용 방어. 두 엔드포인트만 조인다 — 조리 중 API 호출은 잦아서 전역 제한을 걸면 정상 사용자가 막힌다.
#
# - upload: 사진 업로드. S3 저장·전송 비용이 직접 걸린 지점.
# - login:  POST /api/v1/auth/* (소셜·개발자 로그인). 익명 발급이 사라진 뒤 유일한 무인증 진입점이라,
#           여기가 열려 있으면 계정을 무한히 찍어내 업로드 제한을 우회하고 개발자 시크릿을 계속 때려볼 수 있다.
#           (옛 이름 signup — 익명 발급용이었다가 #73 에서 로그인용으로 재사용됐는데, 같은 날 서버에서
#            "죽은 설정"으로 지워져 어긋났다. 이름을 바꿔 같은 일이 반복되지 않게 한다.)
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

# 기본값 503(서버 문제)은 오해를 부른다. 429 = "너무 많이 보냈다"가 정확하다.
limit_req_status 429;

# 앞단(Caddy)이 붙인 프로토콜을 그대로 전달하기 위한 맵. 없으면 자기 scheme 을 쓴다.
# cookpilot.conf 의 proxy_set_header X-Forwarded-Proto $fwd_proto 가 쓴다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
