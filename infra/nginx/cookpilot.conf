server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 공통 프록시 설정. location 마다 반복하지 않도록 server 레벨에 둔다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 12m;

    # 사진 업로드 — S3 저장 비용이 걸린 지점. burst 는 여러 장을 한 번에 올리는 정상 사용을 위해 둔다.
    location = /api/v1/reviews/photos {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # 로그인 — 익명 발급이 사라진 뒤 유일한 무인증 진입점이다. 여기가 열려 있으면
    # 계정을 무제한 찍어내 업로드 제한을 우회할 수 있고, 개발자 로그인 시크릿도 계속 때려볼 수 있다.
    location ^~ /api/v1/auth/ {
        limit_req zone=signup burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
