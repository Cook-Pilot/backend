# 2026-08-20: cooklog.kr 도입으로 80/443 은 web 스택의 Caddy 가 받는다. nginx 는 8081 로 내려와
# Caddy 뒤에서 백엔드(8080) 앞의 rate limit 관문으로만 남는다. 보안그룹이 80/443/22 만 열어
# 두므로 8081 은 서버 내부(Caddy 컨테이너 → 호스트)에서만 닿는다.
#
# nginx 를 걷어내지 않는 이유: 사진 업로드·로그인 rate limit 이 여기 있고 검증돼 있다.
# 흐름:  인터넷 → Caddy(web 스택, 80/443) → nginx(8081) → Spring(8080)
#        옛 APK 의 http://13.209.243.235 직접 호출도 Caddy 가 받아 여기로 넘긴다.
server {
    listen 8081 default_server;
    listen [::]:8081 default_server;

    # Caddy 뒤로 들어오므로 $remote_addr 는 도커 게이트웨이가 된다.
    # 그대로 두면 limit_req 가 전 사용자를 한 IP 로 묶어버려 업로드·로그인 제한이 무너진다.
    # Caddy 가 header_up X-Forwarded-For {client_ip} 로 실제 IP 를 넣어주므로 그것을 신뢰한다.
    # 8081 은 외부에서 못 닿아 헤더 위조 경로가 없다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 공통 프록시 설정. location 마다 반복하지 않도록 server 레벨에 둔다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 앞단(Caddy)이 HTTPS 로 받았으면 그 값을 그대로 넘긴다. $scheme 을 쓰면 항상 http 가 되어
    # 백엔드가 평문 접속으로 오해한다. $fwd_proto 는 ratelimit.conf 의 map 이 정의한다.
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
    client_max_body_size 12m;

    # 사진 업로드 — S3 저장 비용이 걸린 지점. burst 는 여러 장을 한 번에 올리는 정상 사용을 위해 둔다.
    location = /api/v1/reviews/photos {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # 로그인 — 익명 발급이 사라진 뒤 유일한 무인증 진입점이다(#73). 여기가 열려 있으면
    # 계정을 무제한 찍어내 업로드 제한을 우회할 수 있고, 개발자 로그인 시크릿도 계속 때려볼 수 있다.
    # (2026-08-20 서버에서 옛 signup zone 을 "죽은 설정"으로 지운 것과 같은 날 이 location 이
    #  머지돼 서로 어긋났고, 그 결과 운영 로그인 경로에 제한이 없는 채로 하루가 지났다.
    #  zone 이름을 login 으로 바꿔 용도를 분명히 한다.)
    location ^~ /api/v1/auth/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
